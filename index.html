<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Essay Planner — AC English (v9)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0f14;
      --surface: #141a24;
      --surface-2: #1c2433;
      --border: #2a3548;
      --text: #e8edf5;
      --muted: #94a3b8;
      --accent: #5eead4;
      --accent-dim: rgba(94, 234, 212, 0.14);
      --warn: #fbbf24;
      --radius: 10px;
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      /* Popover: ~50% snappier than a typical 200ms fade (100ms) + smooth ease */
      --popup-in-ms: 100ms;
      --popup-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html {
      font-size: clamp(14px, 0.28vw + 13.2px, 17px);
      -webkit-text-size-adjust: 100%;
    }
    html, body {
      height: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text);
      background: radial-gradient(1200px 800px at 10% -10%, rgba(94, 234, 212, 0.08), transparent 50%),
        radial-gradient(900px 600px at 100% 0%, rgba(99, 102, 241, 0.06), transparent 45%),
        var(--bg);
      min-height: 100%;
      scrollbar-width: thin;
      scrollbar-color: rgba(94, 234, 212, 0.35) var(--surface);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(94, 234, 212, 0.32) var(--surface);
    }
    *::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }
    *::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 100px;
    }
    *::-webkit-scrollbar-thumb {
      background: linear-gradient(
        175deg,
        rgba(94, 234, 212, 0.42) 0%,
        rgba(94, 234, 212, 0.14) 100%
      );
      border-radius: 100px;
      border: 2px solid var(--bg);
      background-clip: padding-box;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(
        175deg,
        rgba(94, 234, 212, 0.58) 0%,
        rgba(94, 234, 212, 0.28) 100%
      );
      border: 2px solid var(--bg);
      background-clip: padding-box;
    }
    *::-webkit-scrollbar-corner {
      background: var(--bg);
    }

    .wrap {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding-top: max(clamp(0.75rem, 2vw, 1.35rem), env(safe-area-inset-top));
      padding-right: max(clamp(0.75rem, 4vw, 2.5rem), env(safe-area-inset-right));
      padding-bottom: clamp(2rem, 5vw, 3.5rem);
      padding-left: max(clamp(0.75rem, 4vw, 2.5rem), env(safe-area-inset-left));
    }

    header.top {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }
    .top-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.45rem 1rem;
    }
    .top-title-row h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #save-status.save-status {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      max-width: min(70vw, 20rem);
      text-align: right;
      line-height: 1.25;
      flex-shrink: 1;
      min-height: 1.2em;
      transition: color 0.15s ease;
    }
    #save-status.save-status:empty {
      display: none;
    }
    #save-status.save-status.save-status--ok {
      color: #34d399;
    }
    #save-status.save-status.save-status--warn {
      color: var(--warn);
      font-weight: 600;
    }
    #save-status.save-status.save-status--muted {
      color: var(--muted);
      font-weight: 500;
    }
    header.top > .top-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.65rem 0.85rem;
      padding: 0.75rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }
    .meta-row label {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      flex: 1 1 auto;
      min-width: 120px;
    }
    .meta-row label.word-count-label { min-width: 100px; flex: 0 1 110px; }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      font: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.27rem 0.55rem;
    }
    input[type="number"] { font-family: var(--mono); font-size: 0.9rem; }
    textarea {
      width: 100%;
      min-height: 2.7rem;
      resize: vertical;
    }
    .plan-fields .field,
    .conc-fields .field {
      margin-bottom: 0.42rem;
    }
    .plan-fields .field label.prompt,
    .conc-fields .field label.prompt {
      margin-bottom: 0.15rem;
      font-size: 0.8rem;
      line-height: 1.25;
    }
    .plan-fields textarea,
    .conc-fields textarea {
      min-height: 0.95rem;
      padding: 0.16rem 0.42rem;
      line-height: 1.3;
      font-size: 0.86rem;
    }
    input:focus, select:focus, textarea:focus, .body-unified-editor:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: flex-end;
      margin-bottom: 1rem;
    }
    .toolbar label.row-label {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .toolbar select {
      min-width: min(220px, 100%);
      max-width: 100%;
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      font-weight: 500;
      font-size: 0.88rem;
    }
    button.primary {
      background: var(--accent-dim);
      border-color: rgba(94, 234, 212, 0.35);
      color: var(--accent);
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    section.block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1rem 0.25rem;
      margin-bottom: 1rem;
    }
    section.block h3 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .field {
      margin-bottom: 0.85rem;
    }
    .field label.prompt {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
      font-size: 0.92rem;
    }
    /* Field hints live in label title + section title popovers */

    details.planner-fold {
      font-size: 0.85rem;
      color: var(--muted);
      margin: -0.35rem 0 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.5rem;
      background: rgba(0, 0, 0, 0.12);
    }
    details.planner-fold summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
    }

    .field-pear-bubble {
      display: block;
      position: absolute;
      left: 0;
      top: calc(100% + 6px);
      z-index: 60;
      min-width: min(440px, calc(100vw - 1.25rem));
      width: max(100%, min(440px, calc(100vw - 1.25rem)));
      max-width: min(760px, calc(100vw - 1.25rem));
      padding: 0.7rem 0.95rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text);
      background: linear-gradient(165deg, rgba(28, 36, 51, 0.98) 0%, rgba(20, 26, 36, 0.99) 100%);
      border: 1px solid rgba(94, 234, 212, 0.18);
      border-radius: var(--radius);
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.18),
        0 16px 40px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px) scale(0.985);
      transition:
        opacity var(--popup-in-ms) var(--popup-ease),
        transform var(--popup-in-ms) var(--popup-ease),
        visibility 0s linear var(--popup-in-ms);
      pointer-events: none;
    }
    .field-pear-bubble-inner .pear-popup-body p {
      margin: 0 0 0.5rem;
      font-size: 0.84rem;
    }
    .field-pear-bubble-inner .pear-popup-body p:last-child {
      margin-bottom: 0;
    }
    .field-label-hint-host:hover .field-pear-bubble,
    .field-label-hint-host:focus-within .field-pear-bubble {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      transition:
        opacity var(--popup-in-ms) var(--popup-ease),
        transform var(--popup-in-ms) var(--popup-ease),
        visibility 0s linear 0s;
      pointer-events: auto;
    }

    .body-count {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    .body-count label { min-width: 200px; }

    .para-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      margin-bottom: 0.85rem;
    }
    .body-editor-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .sentence-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.4rem 0.6rem;
      position: relative;
    }
    .btn-add-sentence,
    .btn-sentence-preset {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      cursor: pointer;
    }
    .btn-sentence-preset {
      font-weight: 500;
      color: var(--text);
    }
    .btn-add-sentence:hover,
    .btn-sentence-preset:hover {
      filter: brightness(1.06);
    }
    .sentence-picker {
      position: fixed;
      z-index: 3000;
      width: min(440px, calc(100vw - 1.25rem));
      max-width: calc(100vw - 1.25rem);
      max-height: none;
      overflow: visible;
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }
    .sentence-picker[hidden] {
      display: none !important;
    }
    .sentence-picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.45rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .sentence-picker-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-sentence-done {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.3rem 0.55rem;
      border-radius: 8px;
      border: 1px solid rgba(94, 234, 212, 0.45);
      background: var(--accent-dim);
      color: var(--accent);
      cursor: pointer;
    }
    .btn-sentence-done:hover {
      filter: brightness(1.08);
    }
    .sentence-picker-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 6px;
    }
    .sentence-picker-close:hover {
      color: var(--text);
      background: var(--surface-2);
    }
    .sentence-picker-grid {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      padding: 0.4rem 0.5rem 0.5rem;
    }
    .sentence-picker-row {
      display: grid;
      grid-template-columns: 1fr 2.75rem;
      align-items: center;
      gap: 0.4rem;
      min-height: 1.55rem;
    }
    .sentence-picker-row .st-label-wrap {
      min-width: 0;
    }
    .sentence-picker-row .st-label {
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.25;
    }
    .sentence-picker-row .st-tip {
      display: none;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .sentence-slot {
      width: 2.75rem;
      height: 1.85rem;
      padding: 0;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--accent);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      cursor: pointer;
      flex-shrink: 0;
    }
    .sentence-slot:hover,
    .sentence-slot:focus-visible {
      border-color: rgba(94, 234, 212, 0.5);
      outline: none;
    }
    .sentence-slot[data-num] {
      border-style: solid;
      border-color: rgba(94, 234, 212, 0.35);
    }
    .body-unified-textarea {
      width: 100%;
      min-height: 12rem;
      resize: vertical;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    div.body-unified-editor.body-unified-textarea {
      white-space: normal;
      overflow-wrap: anywhere;
      cursor: text;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.55rem;
      color: #ffffff;
      caret-color: var(--accent);
    }
    .body-genre-label {
      display: inline;
      color: var(--muted);
      font-weight: 600;
    }
    span.body-genre-lead {
      white-space: nowrap;
    }
    .body-plan-note {
      display: inline;
      color: #ffffff;
      font-weight: 400;
    }
    div.body-unified-editor.body-structured-host.body-unified-textarea {
      min-height: 0;
      cursor: default;
    }
    .body-structured-rows {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .body-plan-label-row {
      margin: 0;
      line-height: 1.25;
    }
    .body-plan-row {
      margin: 0;
    }
    .body-plan-slim-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      min-height: 1.35rem;
      max-height: 8rem;
      padding: 0.16rem 0.42rem;
      font: inherit;
      font-size: 0.86rem;
      line-height: 1.3;
      resize: vertical;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 0.12rem;
    }
    .body-plan-slim-input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .body-beat-hint {
      margin: 0 0 0.45rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .body-beat-hint strong {
      color: var(--text);
    }
    .body-editor-wrap .planner-fold {
      margin: 0.15rem 0 0.15rem;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .planner-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .plan-conclusion-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      align-items: stretch;
    }
    @media (max-width: 720px) {
      .plan-conclusion-cards {
        grid-template-columns: 1fr;
      }
    }
    .planner-section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      /* visible so section hint bubbles can extend past the card width */
      overflow: visible;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .planner-section-card-head {
      padding: 0.55rem 0.85rem;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      flex-shrink: 0;
    }
    .planner-section-card .planner-details-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .planner-details-inner {
      padding: 0.85rem 1rem 1rem;
    }
    .body-cards-region {
      margin: 0;
    }
    .body-cards-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }
    .body-cards-toolbar-title {
      flex: 1;
      min-width: 0;
    }
    .body-cards-heading {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .section-hint-host {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      max-width: 100%;
    }
    .section-title-text {
      border-bottom: 1px dotted rgba(148, 163, 184, 0.45);
      cursor: help;
    }
    .section-hint-bubble {
      display: block;
      position: absolute;
      left: 0;
      top: calc(100% + 8px);
      z-index: 100;
      min-width: min(440px, calc(100vw - 1.25rem));
      width: max(100%, min(440px, calc(100vw - 1.25rem)));
      max-width: min(760px, calc(100vw - 1.25rem));
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--text);
      background: linear-gradient(165deg, rgba(28, 36, 51, 0.98) 0%, rgba(20, 26, 36, 0.99) 100%);
      border: 1px solid rgba(94, 234, 212, 0.18);
      border-radius: var(--radius);
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.18),
        0 16px 40px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px) scale(0.985);
      transition:
        opacity var(--popup-in-ms) var(--popup-ease),
        transform var(--popup-in-ms) var(--popup-ease),
        visibility 0s linear var(--popup-in-ms);
      pointer-events: none;
    }
    .section-hint-bubble-inner p {
      margin: 0 0 0.45rem;
    }
    .section-hint-bubble-inner p:last-child {
      margin-bottom: 0;
    }
    .hint-popover-lead {
      margin: 0 0 0.5rem !important;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .hint-popover-muted {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.45rem !important;
    }
    ul.hint-popover-list {
      margin: 0;
      padding-left: 1.15rem;
      color: var(--muted);
    }
    ul.hint-popover-list li {
      margin-bottom: 0.35rem;
    }
    ul.hint-popover-list li:last-child {
      margin-bottom: 0;
    }
    .section-hint-host:hover .section-hint-bubble,
    .section-hint-host:focus-within .section-hint-bubble {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      transition:
        opacity var(--popup-in-ms) var(--popup-ease),
        transform var(--popup-in-ms) var(--popup-ease),
        visibility 0s linear 0s;
      pointer-events: auto;
    }
    /* Exactly three columns per row: bodies 1–3, then 4–6, then 7–9, etc. */
    .body-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(0.65rem, 2vw, 1rem);
      align-items: start;
    }
    @media (max-width: 720px) {
      .body-cards-grid {
        grid-template-columns: 1fr;
      }
    }
    .body-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: visible;
      position: relative;
      z-index: 0;
    }
    .body-card-head {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.65rem;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .body-card-title {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.65rem;
    }
    .body-card-title-main {
      font-weight: 600;
    }
    .body-card-dot-hint {
      font-weight: 400;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    .body-card-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    button.card-copy {
      border: none;
      border-radius: 6px;
      background: rgba(94, 234, 212, 0.1);
      color: var(--accent);
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.card-copy:hover {
      background: rgba(94, 234, 212, 0.2);
      filter: none;
    }
    button.card-copy svg {
      display: block;
    }
    button.card-remove {
      border: none;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      width: 1.75rem;
      height: 1.75rem;
      line-height: 1;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    button.card-remove:hover {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
      filter: none;
    }
    /* Replace native title= tooltips on card actions — matches hint bubble styling */
    .card-action-tooltip-host {
      position: relative;
      display: inline-flex;
      z-index: 5;
    }
    .card-action-tooltip {
      position: absolute;
      left: 50%;
      top: calc(100% + 6px);
      z-index: 70;
      padding: 0.45rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: var(--text);
      background: linear-gradient(165deg, rgba(28, 36, 51, 0.98) 0%, rgba(20, 26, 36, 0.99) 100%);
      border: 1px solid rgba(94, 234, 212, 0.18);
      border-radius: var(--radius);
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.18),
        0 14px 36px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 4px) scale(0.985);
      transition:
        opacity var(--popup-in-ms) var(--popup-ease),
        transform var(--popup-in-ms) var(--popup-ease),
        visibility 0s linear var(--popup-in-ms);
      pointer-events: none;
    }
    .card-action-tooltip-host:hover .card-action-tooltip,
    .card-action-tooltip-host:focus-within .card-action-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0) scale(1);
      transition:
        opacity var(--popup-in-ms) var(--popup-ease),
        transform var(--popup-in-ms) var(--popup-ease),
        visibility 0s linear 0s;
      pointer-events: none;
    }
    .body-card .planner-details-inner {
      padding: 0.65rem 0.75rem 0.85rem;
    }
    .body-card .para-card {
      margin-bottom: 0;
    }

    @media (max-width: 540px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar label.row-label {
        width: 100%;
      }
      .toolbar select {
        width: 100%;
      }
    }

    @media print {
      body { background: #fff; color: #111; }
      div.body-unified-editor.body-unified-textarea {
        color: #111 !important;
      }
      .body-genre-label {
        color: #555 !important;
      }
      .body-plan-note {
        color: #111 !important;
      }
      .body-plan-slim-input {
        color: #111 !important;
        background: #fff !important;
        border-color: #ccc !important;
      }
      #save-status.save-status {
        display: none !important;
      }
      .toolbar, button { display: none; }
      section.block, .meta-row, .para-card, .planner-section-card {
        border-color: #ccc;
        break-inside: avoid;
      }
      .body-cards-toolbar button { display: none; }
      button.card-remove,
      button.card-copy { display: none !important; }
      .sentence-picker { display: none !important; }
      .body-cards-grid {
        grid-template-columns: 1fr !important;
      }
      .plan-conclusion-cards {
        grid-template-columns: 1fr !important;
      }
      .planner-section-card,
      .body-card {
        display: block !important;
      }
      .planner-section-card-head,
      .body-card-head {
        border-bottom: 1px solid #ccc;
      }
      .section-hint-bubble,
      .field-pear-bubble {
        display: block !important;
        position: static !important;
        width: auto !important;
        min-width: 0 !important;
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
        transition: none !important;
        box-shadow: none !important;
        margin-top: 0.35rem;
        max-width: none !important;
        pointer-events: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="top-title-row">
        <h1>Essay &amp; text planner</h1>
        <span id="save-status" class="save-status" aria-live="polite"></span>
      </div>
      <p class="top-subtitle">Australian Curriculum English · v9-aligned text types</p>
    </header>

    <div class="meta-row" role="group" aria-label="Assignment details">
      <label>Name <input type="text" id="f-name" autocomplete="name" placeholder="Your name" /></label>
      <label>Subject / class <input type="text" id="f-subject" placeholder="e.g. Year 10 English" /></label>
      <label>Topic / question <input type="text" id="f-topic" placeholder="Prompt or title" /></label>
      <label class="word-count-label">Word count <input type="number" id="f-words" min="0" step="50" placeholder="e.g. 800" /></label>
      <label>Year band <select id="f-year-band" aria-label="Year level band for PEAR-style guidance" title="Australian Curriculum v9 / QCAA-style bands — shapes analytical body paragraph labels">
        <option value="78">Years 7–8</option>
        <option value="910" selected>Years 9–10</option>
        <option value="1112">Years 11–12</option>
      </select></label>
    </div>

    <div class="toolbar">
      <label class="row-label">Text type
        <select id="f-type" aria-describedby="type-hint"></select>
      </label>
      <button type="button" class="primary" id="btn-copy">Copy outline</button>
      <button type="button" class="primary" id="btn-email-mrc" title="Opens your email app and copies a formatted version to paste">Email Mr C</button>
      <button type="button" id="btn-clear">Clear saved</button>
    </div>
    <p id="type-hint" style="margin:0 0 1rem;font-size:0.85rem;color:var(--muted)"></p>

    <main id="planner-main"></main>
  </div>

  <script>
(function () {
  "use strict";

  var STORAGE_KEY = "essayplanner-planomy-v1";
  var MR_C_EMAIL = "achievewriting@gmail.com";
  var MIN_BODY = 1;
  var MAX_BODY = 24;
  var bodyCountMemory = 3;
  var pendingBodyRestore = null;

  function yearBandValue() {
    var el = $("f-year-band");
    return el && el.value ? el.value : "910";
  }

  function isAnalyticalFamily(typeId) {
    return typeId === "analytical" || typeId === "comparative" || typeId === "other";
  }

  /**
   * Analytical / comparative / “other” body scaffold by AC v9 & QCAA-style achievement bands
   * (7–8, 9–10, 11–12). Keys align with legacy per-slot migration order.
   */
  function bodyAnalyticalSectionPlanByBand(yb) {
    if (yb === "78") {
      return [
        { key: "point", title: "Idea / representation:" },
        { key: "evidence", title: "Evidence:" },
        { key: "explanation", title: "Language / text feature:" },
        { key: "analysis", title: "Effect on audience:" }
      ];
    }
    if (yb === "1112") {
      return [
        { key: "point", title: "Argument:" },
        { key: "evidence", title: "Representation:" },
        { key: "explanation", title: "Values & beliefs:" },
        { key: "analysis", title: "Aesthetic effect:" },
        { key: "evaluation", title: "Evaluation:" }
      ];
    }
    /* Years 9–10 (910) */
    return [
      { key: "point", title: "Representation:" },
      { key: "explanation", title: "Technique:" },
      { key: "evidence", title: "Perspective:" },
      { key: "analysis", title: "Audience effect:" }
    ];
  }

  /** Scaffold titles (with colon); blank line between each in the saved body string. */
  function bodySectionPlan(typeId, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    if (isAnalyticalFamily(typeId)) {
      return bodyAnalyticalSectionPlanByBand(yb);
    }
    if (typeId === "narrative") {
      return [
        { key: "plot", title: "Plot:" },
        { key: "scene", title: "Scene:" },
        { key: "craft", title: "Craft:" },
        { key: "theme", title: "Theme:" }
      ];
    }
    if (typeId === "online") {
      return [
        { key: "subhead", title: "Subhead:" },
        { key: "focus", title: "Focus:" },
        { key: "evidence", title: "Evidence:" },
        { key: "engagement", title: "Engagement:" },
        { key: "tone", title: "Tone:" }
      ];
    }
    if (typeId === "persuasive") {
      return [
        { key: "topic", title: "Topic:" },
        { key: "evidence", title: "Evidence:" },
        { key: "explanation", title: "Explanation:" },
        { key: "appeals", title: "Appeals:" },
        { key: "link", title: "Link:" }
      ];
    }
    if (typeId === "informative") {
      return [
        { key: "focus", title: "Focus:" },
        { key: "evidence", title: "Evidence:" },
        { key: "explanation", title: "Explanation:" },
        { key: "structure", title: "Structure:" },
        { key: "link", title: "Link:" }
      ];
    }
    return bodyAnalyticalSectionPlanByBand(yb);
  }

  function bodyHeadingLines(typeId, yearBand) {
    return bodySectionPlan(typeId, yearBand).map(function (p) {
      return p.title;
    });
  }

  function buildBodyTemplate(typeId, yearBand) {
    return bodyHeadingLines(typeId, yearBand).join("\n\n");
  }

  /** All known label lines for grey styling (includes prior scaffolds so old saves still tint). */
  function allBodyLabelTitles(typeId) {
    var seen = {};
    var out = [];
    function add(t) {
      if (!t || seen[t]) return;
      seen[t] = true;
      out.push(t);
    }
    if (isAnalyticalFamily(typeId)) {
      ["78", "910", "1112"].forEach(function (yb) {
        bodySectionPlan(typeId, yb).forEach(function (p) {
          add(p.title);
        });
      });
      ["Point:", "Explanation:", "Evidence:", "Analysis:"].forEach(add);
      [
        "Linked point:",
        "Evidence — texts:",
        "Comparison / contrast:",
        "Evaluation:",
        "Paragraph focus:",
        "Development:",
        "Evidence / examples:",
        "Significance:"
      ].forEach(add);
      return out;
    }
    bodySectionPlan(typeId, "910").forEach(function (p) {
      add(p.title);
    });
    return out;
  }

  function getSuffixes() {
    return ["body"];
  }

  /** Academic / non-fiction sentence “jobs” — user builds a numbered plan with + Sentence, then writes under each line. */
  var SENTENCE_TYPES = [
    { id: "topic", label: "Topic Sentence", tip: "Opens the paragraph with the main claim" },
    { id: "explanation", label: "Explanation", tip: "Unpacks or clarifies the idea in plain terms" },
    { id: "context", label: "Context", tip: "Background or setup before evidence" },
    { id: "evidence", label: "Evidence", tip: "Quote, example, data, or reference" },
    { id: "technique", label: "Technique / Feature", tip: "Names the linguistic, aesthetic, or structural device" },
    { id: "analysis", label: "Analysis", tip: "Unpacks what the evidence or technique does or means" },
    { id: "cavab", label: "CAVAB", tip: "Cultural assumption, attitude, value, or belief the text reveals" },
    { id: "effect", label: "Effect on Reader", tip: "How it positions or affects the audience" },
    { id: "counterargument", label: "Counterargument", tip: "Introduces an opposing view" },
    { id: "rebuttal", label: "Rebuttal", tip: "Dismantles the counterargument" },
    { id: "synthesis", label: "Synthesis", tip: "Connects two ideas, texts, or perspectives" },
    { id: "link", label: "Link", tip: "Closes the paragraph; ties back to thesis" },
    { id: "takeaway", label: "Takeaway", tip: "Broader significance or key message to leave with the reader" }
  ];

  /** Narrative fiction sentence “jobs” — action, interiority, scene, voice (seven slots). */
  var NARRATIVE_SENTENCE_TYPES = [
    { id: "action", label: "Action", tip: "What happens on the page — movement, gesture, beat" },
    { id: "thinking", label: "Thinking", tip: "Interior thought — wonder, doubt, memory, planning" },
    { id: "feeling", label: "Feeling", tip: "Emotion — named or shown through body and reaction" },
    { id: "description", label: "Description", tip: "Concrete sensory detail — image, texture, sound" },
    { id: "atmosphere", label: "Atmosphere", tip: "Mood and feel — pace, weather, tension in the air" },
    { id: "story", label: "Story", tip: "Plot move — obstacle, turn, consequence, time shift" },
    { id: "dialogue", label: "Dialogue", tip: "Spoken lines — voice, rhythm, what is left unsaid" }
  ];

  /** Old narrative preset ids — still recognised for grey styling in saved bodies. */
  var NARRATIVE_LEGACY_SENTENCE_IDS = ["topic", "context", "evidence", "analysis", "effect", "takeaway"];

  /** Years 7–8 analytical typically omits CAVAB in curriculum sequencing (still recognised in saved text). */
  function analyticalOmitsCavab(yearBand) {
    return (yearBand != null ? yearBand : yearBandValue()) === "78";
  }

  function getSentenceTypesForType(typeId, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    if (typeId === "narrative") return NARRATIVE_SENTENCE_TYPES;
    if (typeId === "analytical" && analyticalOmitsCavab(yb)) {
      return SENTENCE_TYPES.filter(function (st) {
        return st.id !== "cavab";
      });
    }
    return SENTENCE_TYPES;
  }

  function getSentencePresetIds(typeId, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    var base = SENTENCE_PRESETS_BY_TYPE[typeId] || SENTENCE_PRESETS_BY_TYPE.other;
    if (typeId === "analytical" && analyticalOmitsCavab(yb)) {
      return base.filter(function (id) {
        return id !== "cavab";
      });
    }
    return base.slice();
  }

  /** Suggested order of sentence types per text type (students can still pick any type, any order). */
  var SENTENCE_PRESETS_BY_TYPE = {
    analytical: ["topic", "context", "evidence", "technique", "analysis", "cavab", "effect", "link"],
    comparative: ["topic", "synthesis", "evidence", "technique", "analysis", "cavab", "effect", "link"],
    persuasive: ["topic", "context", "evidence", "explanation", "counterargument", "rebuttal", "link", "takeaway"],
    informative: ["topic", "context", "evidence", "explanation", "synthesis", "link", "takeaway"],
    narrative: ["action", "thinking", "feeling", "description", "atmosphere", "story", "dialogue"],
    online: ["topic", "context", "evidence", "technique", "effect", "link", "takeaway"],
    other: ["topic", "context", "evidence", "technique", "analysis", "cavab", "effect", "link", "takeaway"]
  };

  function getSentenceTypeById(id, typeId, yearBand) {
    var tid =
      typeId != null
        ? typeId
        : $("f-type") && $("f-type").value
          ? $("f-type").value
          : "analytical";
    var yb = yearBand != null ? yearBand : yearBandValue();
    var list = getSentenceTypesForType(tid, yb);
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    for (var j = 0; j < SENTENCE_TYPES.length; j++) {
      if (SENTENCE_TYPES[j].id === id) return SENTENCE_TYPES[j];
    }
    return null;
  }

  /** Labels for longest-prefix match (current type + narrative legacy). */
  function allSentenceLabelsSorted(typeId, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    var seen = {};
    var labels = [];
    function add(lab) {
      if (!lab || seen[lab]) return;
      seen[lab] = true;
      labels.push(lab);
    }
    getSentenceTypesForType(typeId, yb).forEach(function (st) {
      add(st.label);
    });
    if (typeId === "analytical" && analyticalOmitsCavab(yb)) {
      add("CAVAB");
    }
    if (typeId === "narrative") {
      for (var li = 0; li < NARRATIVE_LEGACY_SENTENCE_IDS.length; li++) {
        for (var sj = 0; sj < SENTENCE_TYPES.length; sj++) {
          if (SENTENCE_TYPES[sj].id === NARRATIVE_LEGACY_SENTENCE_IDS[li]) {
            add(SENTENCE_TYPES[sj].label);
            break;
          }
        }
      }
    }
    labels.sort(function (a, b) {
      return b.length - a.length;
    });
    return labels;
  }

  /**
   * Optional legacy “N. ” prefix, then a known sentence-type label.
   * Stored lines use “Label: notes” (no numbers).
   */
  function splitSentencePlanLine(trimmed, typeId, yearBand) {
    var work = trimmed;
    var numPref = work.match(/^(\d+)\.\s+/);
    if (numPref) work = work.slice(numPref[0].length);
    var labels = allSentenceLabelsSorted(typeId, yearBand != null ? yearBand : yearBandValue());
    for (var i = 0; i < labels.length; i++) {
      var L = labels[i];
      if (work.indexOf(L) !== 0) continue;
      var nextCh = work.charAt(L.length);
      if (nextCh !== "" && nextCh !== " " && nextCh !== ":") continue;
      return { label: L, tail: work.slice(L.length) };
    }
    return null;
  }

  function extractSentencePlanNotes(tail) {
    var notes = "";
    var colonRest = tail.match(/^\s*:\s*(.*)$/);
    if (colonRest) notes = colonRest[1];
    else if (tail && /\S/.test(tail)) notes = tail.replace(/^\s+/, "");
    return notes;
  }

  function parseBodyPlainToPlanSegments(plain, typeId, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    var plans = [];
    var freeLines = [];
    var lines = String(plain || "").split(/\n/);
    for (var i = 0; i < lines.length; i++) {
      var trimmed = lines[i].trim();
      if (!trimmed) continue;
      var sp = splitSentencePlanLine(trimmed, typeId, yb);
      if (sp) {
        plans.push({ label: sp.label, note: extractSentencePlanNotes(sp.tail) });
      } else {
        freeLines.push(trimmed);
      }
    }
    return { plans: plans, freeLines: freeLines };
  }

  function shouldUseStructuredBodyEditor(typeId, plain, yearBand) {
    var p = parseBodyPlainToPlanSegments(plain, typeId, yearBand);
    return p.plans.length > 0 && p.freeLines.length === 0;
  }

  function serializeStructuredBodyFromDom(host) {
    var rows = host.querySelectorAll(".body-plan-row");
    var parts = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var lab = row.getAttribute("data-label") || "";
      var ta = row.querySelector("textarea.body-plan-slim-input");
      var note = ta ? ta.value : "";
      parts.push(lab + ": " + note);
    }
    return parts.join("\n\n");
  }

  function buildStructuredBodyInnerHtml(bodyId, typeId, plain, yearBand) {
    var p = parseBodyPlainToPlanSegments(plain, typeId, yearBand);
    var html = '<div class="body-structured-rows">';
    for (var i = 0; i < p.plans.length; i++) {
      var row = p.plans[i];
      var tid = bodyId + "-row-" + i;
      html +=
        '<div class="body-plan-row" data-label="' +
        esc(row.label) +
        '">' +
        '<div class="body-plan-label-row"><span class="body-genre-label body-genre-lead">' +
        esc(row.label + ": ") +
        "</span></div>" +
        '<textarea id="' +
        esc(tid) +
        '" class="body-plan-slim-input" rows="1" spellcheck="true" aria-label="' +
        esc("Notes — " + row.label) +
        '">' +
        esc(row.note) +
        "</textarea></div>";
    }
    html += "</div>";
    return html;
  }

  /** True when this line is only scaffold (label / “Label:” with no real notes). */
  function isBareSentencePlanLine(trimmed, typeId, yearBand) {
    var sp = splitSentencePlanLine(trimmed, typeId, yearBand != null ? yearBand : yearBandValue());
    if (!sp) return false;
    var tail = sp.tail;
    if (!tail || !/\S/.test(tail)) return true;
    var cm = tail.match(/^\s*:\s*(.*)$/);
    return !!(cm && !String(cm[1]).trim());
  }

  /** True when the body is only auto sentence-plan lines (no student notes) — treat as empty on load. */
  function isOnlyNumberedSentencePlanBody(plain, typeId, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    var text = plain == null ? "" : String(plain).trim();
    if (text === "") return false;
    var lines = text.split(/\n/);
    var any = false;
    for (var li = 0; li < lines.length; li++) {
      var t = lines[li].trim();
      if (t === "") continue;
      any = true;
      if (!isBareSentencePlanLine(t, typeId, yb)) return false;
    }
    return any;
  }

  function positionSentencePicker(picker, bodyId) {
    if (!picker || picker.hidden) return;
    var escSel = String(bodyId).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    var toolbar = document.querySelector('.sentence-toolbar[data-body-toolbar="' + escSel + '"]');
    var bodyEl = document.getElementById(bodyId);
    var pad = 10;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var pw = Math.min(440, vw - 2 * pad);
    picker.style.width = pw + "px";

    /* Horizontal: place picker so its left edge meets the paragraph’s horizontal centre.
       That keeps the paragraph’s left half to the left of the picker (uncovered). If the
       box would cross the right edge of the window, slide it left (viewport clamp). */
    var left;
    if (bodyEl) {
      var br = bodyEl.getBoundingClientRect();
      var cx = br.left + br.width / 2;
      left = cx;
      if (left + pw > vw - pad) left = vw - pw - pad;
      if (left < pad) left = pad;
    } else {
      left = Math.max(pad, (vw - pw) / 2);
    }

    var top = Math.max(pad, (vh - 420) / 2);
    if (toolbar) {
      var tr = toolbar.getBoundingClientRect();
      top = tr.bottom + 8;
    }
    picker.style.left = left + "px";
    picker.style.top = top + "px";
    var ph = picker.offsetHeight || 0;
    if (ph > 0 && top + ph > vh - pad) {
      top = Math.max(pad, vh - ph - pad);
      picker.style.top = top + "px";
    }
  }

  function repositionOpenSentencePicker() {
    var open = document.querySelector("#planner-main .sentence-picker:not([hidden])");
    if (!open) return;
    var bid = open.getAttribute("data-body-picker");
    if (bid) positionSentencePicker(open, bid);
  }

  var sentencePickerLayoutBound = false;
  function bindSentencePickerLayout() {
    if (sentencePickerLayoutBound) return;
    sentencePickerLayoutBound = true;
    window.addEventListener("resize", repositionOpenSentencePicker);
    window.addEventListener("scroll", repositionOpenSentencePicker, true);
  }

  function closeAllSentencePickers() {

  function toggleSentenceSlot(slotBtn, picker) {

    var cur = slotBtn.getAttribute("data-num");

  /** Compact assigned numbers to 1…n in sort order, then write “Label: ” lines (slim row UI when rendered). */
  function applySentenceSlotsToBody(bodyId) {
    var picker = getSentencePickerForBody(bodyId);
    if (!picker) return;
    var pairs = [];
    var planType = sentencePlannerTypeFromPicker(picker);
    var ybSlot = $("f-year-band") ? $("f-year-band").value : "910";
    picker.querySelectorAll(".sentence-slot").forEach(function (slot) {
      var num = slot.getAttribute("data-num");
      if (num == null || String(num).trim() === "" || isNaN(parseInt(num, 10))) return;
      var sid = slot.getAttribute("data-sentence");
      var st = getSentenceTypeById(sid, planType, ybSlot);
      if (!st) return;
      pairs.push({ num: parseInt(num, 10), label: st.label });
    });
    if (!pairs.length) {
      closeAllSentencePickers();
      return;
    }
    pairs.sort(function (a, b) {
      return a.num - b.num;
    });
    var lines = [];
    for (var j = 0; j < pairs.length; j++) {
      lines.push(pairs[j].label + ": ");
    }
    var block = lines.join("\n\n");
    var el = document.getElementById(bodyId);
    if (!el || !isBodyUnifiedEditor(el)) return;
    var typeId = $("f-type").value;
    var yb = $("f-year-band") ? $("f-year-band").value : "910";
    var plain = readAutosaveValue(el);
    var newPlain = plain.trim() ? plain.replace(/\s+$/, "") + "\n\n" + block : block;
    writeAutosaveBodyHtml(el, typeId, newPlain, yb);
    saveAll();
    clearAllSentenceSlots(picker);
    closeAllSentencePickers();
  }

  function fillSentencePresetSlots(bodyId, typeId) {
    closeAllSentencePickers();

    if (!picker) return;
    clearAllSentenceSlots(picker);
    var ybPreset = $("f-year-band") ? $("f-year-band").value : "910";
    var preset = getSentencePresetIds(typeId, ybPreset);
    for (var pi = 0; pi < preset.length; pi++) {
      var slot = picker.querySelector('.sentence-slot[data-sentence="' + preset[pi] + '"]');
      if (!slot) continue;
      var n = pi + 1;
      slot.setAttribute("data-num", String(n));
      slot.textContent = String(n);
      var st = getSentenceTypeById(preset[pi], typeId, ybPreset);
      if (st) {
        slot.setAttribute("aria-label", "Order " + n + " — " + st.label + " (click to clear)");
      }
    }
    picker.hidden = false;
    bindSentencePickerLayout();
    requestAnimationFrame(function () {
      positionSentencePicker(picker, bodyId);
    });
  }

  var sentenceToolbarDocClickBound = false;
  function bindSentenceToolbar() {
    if (sentenceToolbarDocClickBound) return;
    sentenceToolbarDocClickBound = true;
    document.addEventListener(
      "click",
      function (e) {
        var main = $("planner-main");
        if (!main) return;
        var t = e.target;
        if (!main.contains(t)) return;

        var slot = t.closest && t.closest(".sentence-slot");
        if (slot) {
          e.preventDefault();
          e.stopPropagation();
          var pickerEl = slot.closest(".sentence-picker");
          if (pickerEl) toggleSentenceSlot(slot, pickerEl);
          return;
        }

        var doneBtn = t.closest && t.closest(".btn-sentence-done");
        if (doneBtn) {
          e.preventDefault();
          e.stopPropagation();
          var bodyDone = doneBtn.getAttribute("data-body");
          if (bodyDone) applySentenceSlotsToBody(bodyDone);
          return;
        }

        var presetBtn = t.closest && t.closest(".btn-sentence-preset");
        if (presetBtn) {
          e.preventDefault();
          e.stopPropagation();
          var bid = presetBtn.getAttribute("data-body");
          if (bid) fillSentencePresetSlots(bid, $("f-type").value);
          return;
        }

        var addBtn = t.closest && t.closest(".btn-add-sentence");
        if (addBtn) {
          e.preventDefault();
          e.stopPropagation();
          var b = addBtn.getAttribute("data-body");
          if (b) toggleSentencePicker(b);
          return;
        }

        var cls = t.closest && t.closest(".sentence-picker-close");
        if (cls) {
          e.preventDefault();
          e.stopPropagation();
          var bidClose = cls.getAttribute("data-body");
          if (bidClose) {
            var pClose = getSentencePickerForBody(bidClose);
            if (pClose) clearAllSentenceSlots(pClose);
          }
          closeAllSentencePickers();
          return;
        }

        if (!t.closest || !t.closest(".sentence-toolbar")) {
          closeAllSentencePickers();
        }
      },
      true
    );
  }

  /** Field keys from the previous multi-textarea body cards (for migrating saved plans). */
  function legacySuffixList(typeId) {
    if (typeId === "persuasive") return ["point", "evidence", "appeals", "devices", "bridge"];
    if (typeId === "informative") return ["point", "evidence", "structure", "terms", "bridge"];
    if (typeId === "narrative") return ["events", "detail", "devices", "theme"];
    if (typeId === "online") return ["subhead", "point", "evidence", "engagement", "tone"];
    return ["point", "evidence", "aesthetic", "intent", "audience"];
  }

  function legacySectionTitle(typeId, suf) {
    var map = {
      point: "POINT",
      evidence: "EVIDENCE",
      appeals: "APPEALS",
      devices: "DEVICES",
      bridge: "LINK",
      structure: "STRUCTURE",
      terms: "TERMS",
      events: "PLOT",
      detail: "SCENE",
      subhead: "SUBHEAD",
      engagement: "ENGAGEMENT",
      tone: "TONE",
      aesthetic: "ANALYSIS",
      intent: "INTENT",
      audience: "AUDIENCE"
    };
    if (suf === "theme" && typeId === "narrative") return "THEME / CHARACTER";
    if (suf === "devices" && typeId === "narrative") return "CRAFT";
    return map[suf] || String(suf).toUpperCase();
  }

  function mergeLegacyParagraphPlan(typeId, fields, idx1, yearBand) {
    var prefix = "p" + idx1 + "-";
    var yb = yearBand != null ? yearBand : yearBandValue();
    var plan = bodySectionPlan(typeId, yb);
    var bodyKey = prefix + "body";

    function aliasOld(oldKey, newKey) {
      var from = prefix + oldKey;
      var to = prefix + newKey;
      if (fields[from] != null && String(fields[from]).trim() !== "") {
        if (fields[to] == null || String(fields[to]).trim() === "") {
          fields[to] = fields[from];
        }
      }
    }

    if (typeId === "persuasive") {
      aliasOld("point", "topic");
      aliasOld("bridge", "link");
      var pd = fields[prefix + "devices"];
      var pexp = fields[prefix + "explanation"];
      if (pd != null && String(pd).trim() !== "" && (!pexp || String(pexp).trim() === "")) {
        fields[prefix + "explanation"] = pd;
      }
    }
    if (typeId === "informative") {
      aliasOld("point", "focus");
      aliasOld("bridge", "link");
      var tm = fields[prefix + "terms"];
      var st = fields[prefix + "structure"];
      if (tm != null && String(tm).trim() !== "" && (!st || String(st).trim() === "")) {
        fields[prefix + "structure"] = tm;
      }
    }
    if (typeId === "online") {
      aliasOld("point", "focus");
    }
    if (typeId === "narrative") {
      aliasOld("events", "plot");
      aliasOld("detail", "scene");
      aliasOld("devices", "craft");
    }

    if (typeId === "analytical" || typeId === "comparative" || typeId === "other") {
      aliasOld("aesthetic", "analysis");
    }

    var ai = fields[prefix + "intent"];
    var aa = fields[prefix + "audience"];
    var ax = fields[prefix + "analysis"];
    if (
      (typeId === "analytical" || typeId === "comparative" || typeId === "other") &&
      ((ai != null && String(ai).trim() !== "") || (aa != null && String(aa).trim() !== ""))
    ) {
      var tail = [ai, aa].filter(Boolean).join("\n\n");
      if (tail && (ax == null || String(ax).trim() === "")) {
        fields[prefix + "analysis"] = tail;
      }
    }

    if (fields[bodyKey] != null && String(fields[bodyKey]).trim() !== "") {
      return;
    }

    var firstKey = plan[0].key;
    var firstVal = fields[prefix + firstKey];
    if (firstVal != null && String(firstVal).trim() !== "") {
      var fv = String(firstVal).trim();
      if (fv.indexOf("\n") !== -1 || /^\[/.test(fv)) {
        fields[bodyKey] = fv;
        return;
      }
    }

    var parts = [];
    for (var pi = 0; pi < plan.length; pi++) {
      var pk = plan[pi].key;
      var title = plan[pi].title;
      var pv = fields[prefix + pk];
      if (pv != null && String(pv).trim() !== "") {
        parts.push(title + "\n\n" + String(pv).trim());
      }
    }
    if (parts.length) {
      fields[bodyKey] = parts.join("\n\n");
      return;
    }

    var legacy = legacySuffixList(typeId);
    var legacyParts = [];
    for (var li = 0; li < legacy.length; li++) {
      var suf = legacy[li];
      var lk = prefix + suf;
      var lv = fields[lk];
      if (lv != null && String(lv).trim() !== "") {
        legacyParts.push("[" + legacySectionTitle(typeId, suf) + "]\n\n" + String(lv).trim());
      }
    }
    if (legacyParts.length) {
      fields[bodyKey] = legacyParts.join("\n\n");
    }

    /* Empty string was often saved from autosave after a blank textarea — refill headings. */
    var curBody = fields[bodyKey];
    if (
      !Object.prototype.hasOwnProperty.call(fields, bodyKey) ||
      curBody == null ||
      String(curBody).trim() === ""
    ) {
      fields[bodyKey] = "";
    }
  }

  /** Highest N with saved pN-body (fixes bodySlotCount out of sync with field keys). */
  function inferMaxBodyIndexFromFields(fields) {
    var max = 0;
    Object.keys(fields || {}).forEach(function (id) {
      var m = id.match(/^p(\d+)-body$/);
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return max;
  }

  function inferMaxBodyIndexFromDom() {
    var max = 0;
    document.querySelectorAll("[id]").forEach(function (el) {
      if (!el.id) return;
      var m = el.id.match(/^p(\d+)-body$/);
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return max;
  }

  function collectBodyData(n) {
    var suf = getSuffixes();
    var arr = [];
    for (var i = 0; i < n; i++) {
      var o = {};
      var prefix = "p" + (i + 1) + "-";
      for (var s = 0; s < suf.length; s++) {
        var id = prefix + suf[s];
        var el = document.getElementById(id);
        o[suf[s]] = el ? readAutosaveValue(el) : "";
      }
      arr.push(o);
    }
    return arr;
  }

  function applyBodyData(arr) {
    var suf = getSuffixes();
    var typeId = $("f-type").value;
    for (var i = 0; i < arr.length; i++) {
      var o = arr[i];
      var prefix = "p" + (i + 1) + "-";
      for (var s = 0; s < suf.length; s++) {
        var id = prefix + suf[s];
        var el = document.getElementById(id);
        var val = o[suf[s]];
        if (!el || val == null) continue;
        if (isBodyUnifiedEditor(el)) {
          writeAutosaveBodyHtml(el, typeId, String(val), $("f-year-band").value);
        } else {
          el.value = val;
        }
      }
    }
  }

  function insertParagraphAfter(afterIdx) {
    var typeId = $("f-type").value;
    var n = bodyCountMemory;
    var arr = collectBodyData(n);
    var empty = { body: "" };
    if (afterIdx === -1) {
      arr.push(empty);
    } else {
      arr.splice(afterIdx + 1, 0, empty);
    }
    if (arr.length > MAX_BODY) {
      setSaveStatus("Maximum " + MAX_BODY + " body paragraphs");
      setTimeout(function () {
        setSaveStatus("");
      }, 2500);
      return;
    }
    bodyCountMemory = arr.length;
    pendingBodyRestore = arr;
    renderMain();
    saveAll();
  }

  function deleteBodyParagraph(idx) {
    if (!confirm("Remove this paragraph? Any notes in it will be lost.")) return;
    var typeId = $("f-type").value;
    var n = bodyCountMemory;
    if (n <= MIN_BODY) {
      setSaveStatus("Keep at least one body paragraph");
      setTimeout(function () {
        setSaveStatus("");
      }, 2200);
      return;
    }
    var arr = collectBodyData(n);
    arr.splice(idx, 1);
    bodyCountMemory = arr.length;
    pendingBodyRestore = arr;
    renderMain();
    saveAll();
  }

  /** Inserts a new body card immediately after `idx` with the same paragraph text. */
  function duplicateBodyParagraph(idx) {
    var typeId = $("f-type").value;
    var n = bodyCountMemory;
    var arr = collectBodyData(n);
    if (idx < 0 || idx >= arr.length) return;
    var copyBody = arr[idx].body != null ? String(arr[idx].body) : "";
    var clone = { body: copyBody };
    arr.splice(idx + 1, 0, clone);
    if (arr.length > MAX_BODY) {
      setSaveStatus("Maximum " + MAX_BODY + " body paragraphs");
      setTimeout(function () {
        setSaveStatus("");
      }, 2500);
      return;
    }
    bodyCountMemory = arr.length;
    pendingBodyRestore = arr;
    renderMain();
    saveAll();
  }

  function clickTargetElement(e) {

  function $(id) { return document.getElementById(id); }

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function roundRange(lo, hi) {
    return { lo: Math.round(lo), hi: Math.round(hi) };
  }

  function formatRange(r) {
    if (r.lo === r.hi) return String(r.lo);
    return r.lo + "–" + r.hi;
  }

  function getTypeMeta(id) {
    for (var i = 0; i < TEXT_TYPES.length; i++) {
      if (TEXT_TYPES[i].id === id) return TEXT_TYPES[i];
    }
    return TEXT_TYPES[0];
  }

  function computeBudget(total, typeId, bodyCount) {
    if (!total || total < 50) return null;
    var t = getTypeMeta(typeId);
    var ip = t.pct.intro;
    var cp = t.pct.conclusion;
    var intro = roundRange(total * ip[0], total * ip[1]);
    var conclusion = roundRange(total * cp[0], total * cp[1]);
    var bodyTotalLo = Math.max(0, total - intro.hi - conclusion.hi);
    var bodyTotalHi = Math.max(0, total - intro.lo - conclusion.lo);
    var n = clamp(bodyCount || 3, MIN_BODY, MAX_BODY);
    var perLo = bodyTotalLo / n;
    var perHi = bodyTotalHi / n;
    var per = roundRange(Math.min(perLo, perHi), Math.max(perLo, perHi));
    return { intro: intro, bodyEach: per, bodyN: n, conclusion: conclusion, total: total };
  }

  function esc(s) {
    if (!s) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function isBodyUnifiedEditor(el) {
    return !!(el && el.classList && el.classList.contains("body-unified-editor"));
