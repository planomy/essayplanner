  /** Map a trimmed line to a known scaffold label (with colon) for grey styling, or null. */
  function canonicalGenreLabelLine(typeId, trimmed, yearBand) {
    var labels = allBodyLabelTitles(typeId);
    var yb = yearBand != null ? yearBand : yearBandValue();
    var prefer = bodyHeadingLines(typeId, yb);
    var ordered = prefer.concat(
      labels.filter(function (L) {
        return prefer.indexOf(L) === -1;
      })
    );
    for (var i = 0; i < ordered.length; i++) {
      var L = ordered[i];
      if (trimmed === L) return L;
      if (trimmed === L.replace(/:$/, "")) return L;
    }
    return null;
  }

  /** Plain body text → HTML with grey genre labels (saved format stays plain text). Not used when structured slim rows are active. */
  function plainBodyToRichHtml(typeId, plain, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    var text = plain == null ? "" : String(plain);
    if (!text.trim()) {
      return "";
    }
    var lines = text.split(/\n/);
    var out = [];
    for (var j = 0; j < lines.length; j++) {
      var line = lines[j];
      var trimmed = line.trim();
      var planSplit = splitSentencePlanLine(trimmed, typeId, yb);
      if (planSplit) {
        var notes = extractSentencePlanNotes(planSplit.tail);
        out.push(
          '<span class="body-genre-label body-genre-lead">' + esc(planSplit.label + ": ") + "</span>"
        );
        if (notes) {
          out.push('<span class="body-plan-note">' + esc(notes) + "</span>");
        }
        continue;
      }
      var canon = canonicalGenreLabelLine(typeId, trimmed, yb);
      if (canon) {
        out.push('<span class="body-genre-label">' + esc(canon) + "</span>");
      } else {
        out.push(line === "" ? "" : esc(line));
      }
    }
    return out.join("<br>");
  }

  function readAutosaveValue(el) {
    if (!isBodyUnifiedEditor(el)) return el.value;
    if (el.classList.contains("body-structured-host")) {
      return serializeStructuredBodyFromDom(el);
    }
    return el.innerText;
  }

  function writeAutosaveBodyHtml(el, typeId, plain, yearBand) {
    var yb = yearBand != null ? yearBand : yearBandValue();
    var plainStr = plain == null ? "" : String(plain);
    if (shouldUseStructuredBodyEditor(typeId, plainStr, yb)) {
      el.classList.add("body-structured-host");
      el.removeAttribute("contenteditable");
      el.setAttribute("aria-multiline", "true");
      el.innerHTML = buildStructuredBodyInnerHtml(el.id, typeId, plainStr, yb);
      return;
    }
    el.classList.remove("body-structured-host");
    el.setAttribute("contenteditable", "true");
    el.setAttribute("aria-multiline", "true");
    el.innerHTML = plainBodyToRichHtml(typeId, plainStr, yb);
  }

  /** Plain text for HTML title attributes on labels (hints may contain simple entities). */
  function plainHintForTitle(h) {
    if (!h) return "";
    return String(h)
      .replace(/<[^>]*>/g, "")
      .replace(/&rsquo;/g, "\u2019")
      .replace(/&ldquo;/g, "\u201C")
      .replace(/&rdquo;/g, "\u201D")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">");
  }

  function labelTitleAttr(hint) {
    if (!hint) return "";
    return ' title="' + esc(plainHintForTitle(hint)) + '"';
  }

  function wrapSectionHintBubble(innerHtml) {
    return (
      '<span class="section-hint-bubble" role="tooltip">' +
      '<span class="section-hint-bubble-inner">' +
      innerHtml +
      "</span></span>"
    );
  }

  function sectionTitleWithHint(visibleTitle, bubbleInnerHtml) {
    return (
      '<span class="section-hint-host" tabindex="0">' +
      '<span class="section-title-text">' +
      esc(visibleTitle) +
      "</span>" +
      wrapSectionHintBubble(bubbleInnerHtml) +
      "</span>"
    );
  }

  function buildPlanSectionBubbleInner(typeId, thesisHintHtml) {
    var rows = [];
    rows.push("<li><strong>Opening</strong> — How you’ll grab attention and set up the piece.</li>");
    rows.push("<li><strong>Main focus</strong> — " + thesisHintHtml + "</li>");
    if (typeId !== "narrative") {
      rows.push("<li><strong>Points</strong> — One bullet per body paragraph (what each block will cover).</li>");
    }
    if (typeId === "other") {
      rows.push("<li><strong>Text type</strong> — What kind of task this is, in your own words.</li>");
    }
    if (typeId === "persuasive") {
      rows.push("<li><strong>Persuasion notes</strong> — Audience, counter-arguments, and how you’ll answer them (use the fields below).</li>");
    }
    if (typeId === "online") {
      rows.push("<li><strong>Web packaging</strong> — Headline, deck, and call-to-action ideas (fields below).</li>");
    }
    if (typeId === "narrative") {
      rows.push("<li><strong>Story setup</strong> — Narrator, setting, conflict, structure (fields below).</li>");
    }
    return '<ul class="hint-popover-list">' + rows.join("") + "</ul>";
  }

  function buildConcSectionBubbleInner(typeId) {
    var t =
      typeId === "persuasive"
        ? "Restate your stance, answer &ldquo;so what?&rdquo;, and avoid brand-new evidence."
        : typeId === "online"
          ? "Tie the piece together; optional final call to action or reflection."
          : typeId === "narrative"
            ? "Resolve or echo the story — image, feeling, or idea — without a surprise that wasn’t set up."
            : typeId === "informative"
              ? "Summarise what matters most; leave the reader with a clear takeaway or next step."
              : typeId === "other"
                ? "Wrap up in a way that fits your task."
                : typeId === "comparative"
                  ? "Bring the texts together in one insight — avoid two disconnected endings."
                  : "Sum up your line of argument; don’t add new points at the end.";
    return "<p>" + t + "</p>";
  }

  function persuasiveToolkitBlock() {
    return (
      "<details class=\"planner-fold\">" +
      "<summary>Persuasive toolkit (use deliberately, not randomly)</summary>" +
      "<p><strong>Appeals:</strong> <em>Ethos</em> — credibility, tone, fair framing; <em>Pathos</em> — values, story, vivid detail (avoid manipulation); " +
      "<em>Logos</em> — reasons, evidence, cause–effect, criteria.</p>" +
      "<p><strong>Techniques:</strong> rhetorical question; anecdote; statistic or expert voice; analogy; contrast; repetition / parallel structure / rule of three; " +
      "inclusive language (<em>we</em>, <em>us</em>); concession + refutation; call to action; humour (if appropriate).</p>" +
      "<p>Match the device to the job: e.g. logos for a doubtful reader, pathos after you&rsquo;ve earned trust, ethos in how you handle counter-voices.</p>" +
      "</details>"
    );
  }

  function field(id, prompt, hint, extraClass) {
    return (
      "<div class=\"field " + (extraClass || "") + "\">" +
      "<label class=\"prompt\" for=\"" +
      esc(id) +
      "\"" +
      labelTitleAttr(hint) +
      ">" +
      prompt +
      "</label>" +
      "<textarea id=\"" + esc(id) + "\" data-autosave></textarea></div>"
    );
  }

  function fieldInput(id, prompt, hint, placeholder) {
    var ph = placeholder != null ? placeholder : "";
    return (
      "<div class=\"field\">" +
      "<label class=\"prompt\" for=\"" +
      esc(id) +
      "\"" +
      labelTitleAttr(hint) +
      ">" +
      prompt +
      "</label>" +
      '<input type="text" id="' +
      esc(id) +
      "\" data-autosave autocomplete=\"off\" placeholder=\"" +
      esc(ph) +
      "\" /></div>"
    );
  }

  /**
   * Arc-aware titles and questions for narrative middle sections (Australian Curriculum: orientation, complication, climax, resolution).
   */
  function narrativeBeat(index, total) {
    var i = index;
    var n = Math.max(1, total | 0);
    var last = n - 1;
    var role;
    var heading;
    var tagline;

    if (n === 1) {
      role = "single";
      heading = "Middle — build the story";
      tagline = "One continuous block: move from your opening situation toward the change you promise in the ending.";
    } else if (n === 2) {
      role = i === 1 ? "resolution" : "rising";
      heading = i === 0 ? "Complication / rising tension" : "Resolution / denouement";
      tagline =
        i === 0
          ? "Disturb the status quo; deepen the problem, desire, or dilemma."
          : "Land the outcome; show what shifted in the world, a relationship, or the self.";
    } else if (n === 3) {
      if (i === 0) {
        role = "rising";
        heading = "Rising action";
        tagline = "Complications, choices, and rising stakes after your opening.";
      } else if (i === 1) {
        role = "climax";
        heading = "Climax / turning point";
        tagline = "Peak tension — the moment that decides how things will end.";
      } else {
        role = "resolution";
        heading = "Falling action & resolution";
        tagline = "Consequences, release, and a final image or thought.";
      }
    } else if (n === 4) {
      var row4 = [
        { role: "rising", h: "Rising action — early", t: "Establish the new situation; first real pushes against what the protagonist wants." },
        { role: "rising", h: "Rising action — escalation", t: "Stakes rise — setback, revelation, or a point of no return." },
        { role: "climax", h: "Climax / crisis", t: "The decisive confrontation, choice, or revelation." },
        { role: "resolution", h: "Resolution", t: "Aftermath; tie threads; emotional or thematic landing." }
      ];
      role = row4[i].role;
      heading = row4[i].h;
      tagline = row4[i].t;
    } else {
      if (i === last) {
        role = "resolution";
        heading = "Resolution & closure";
        tagline = "What is different now? What feeling or idea do we leave the reader with?";
      } else if (i === n - 2) {
        role = "climax";
        heading = "Climax / turning point";
        tagline = "Irreversible change — the story pivots here.";
      } else if (i === n - 3) {
        role = "crisis";
        heading = "Approaching crisis";
        tagline = "Tighten pressure; force a hard choice, confession, or exposure.";
      } else if (i === 0) {
        role = "rising";
        heading = "Enter the middle";
        tagline = "Bridge from hook to trouble — what kicks the plot properly into gear?";
      } else {
        role = "rising";
        heading = "Rising action — beat " + (i + 1);
        tagline = "Add a complication, revelation, or setback that refuses an easy exit.";
      }
    }

    var qPlot;
    var qPlotHint;
    var qScene;
    var qSceneHint;
    var qCraft = "Craft for this beat (pacing, pattern, voice)";
    var qCraftHint =
      "Sentence length, paragraph breaks, motif, symbol, time jumps, dialogue tags — what serves this moment?";
    var qCharTheme;
    var qCharHint;

    if (role === "resolution") {
      qPlot = "What consequence lands here? (aftermath, cost, or quiet shift)";
      qPlotHint = "Avoid brand-new twists; show what the climax means for character, relationships, or theme.";
      qScene = "Closing texture: image, gesture, dialogue beat, or object";
      qSceneHint = "What do we see or hear in the final stretch so the ending feels embodied, not explained?";
      qCharTheme = "Character & theme: what truth does the reader sit with?";
      qCharHint = "Internal change, irony, or theme shown through action — not a moral lecture.";
    } else if (role === "climax") {
      qPlot = "What is the turning point? (decision, confrontation, or revelation)";
      qPlotHint = "Be specific: who does what, and why it cannot be undone?";
      qScene = "Peak moment on the page: sensory focus, dialogue, or silence";
      qSceneHint = "Slow time or sharpen detail — how do you make the reader feel the stakes?";
      qCharTheme = "Character under pressure: want vs fear in this moment";
      qCharHint = "What do they risk losing? What do they choose when the cost is real?";
    } else if (role === "crisis") {
      qPlot = "What tightens before the climax? (deadline, exposure, sacrifice)";
      qPlotHint = "Make the climax feel earned — narrow options, raise the cost of failure.";
      qScene = "How does the scene reflect mounting pressure? (setting, body, weather, crowd)";
      qSceneHint = "Use environment and reaction shots to echo inner pressure.";
      qCharTheme = "The almost-choice: what do they almost do, and why does it matter?";
      qCharHint = "Foreshadow the final decision without giving it away.";
    } else if (role === "single") {
      qPlot = "What happens across this middle? (cause → effect chain)";
      qPlotHint = "Sequence events or realisations so tension climbs toward your conclusion.";
      qScene = "Key scenes or images you will linger on";
      qSceneHint = "Where will you slow down for sensory detail, dialogue, or a telling object?";
      qCharTheme = "Character arc in the middle: shift in want, flaw, or relationship";
      qCharHint = "What does the protagonist learn, lose, or refuse to see — and how does it show?";
    } else {
      qPlot = "What happens in this beat? (cause → effect)";
      qPlotHint = "One clear move: obstacle surfaces, plan fails, secret slips, loyalty splits …";
      qScene = "On the page: sensory focus, setting, or line of dialogue";
      qSceneHint = "What makes this moment feel lived-in, not summarised?";
      qCharTheme = "Character: want, obstacle, or micro-decision in this beat";
      qCharHint = "How does this section push motivation, flaw, relationship, or subtext forward?";
    }

    return {
      heading: heading,
      tagline: tagline,
      qPlot: qPlot,
      qPlotHint: qPlotHint,
      qScene: qScene,
      qSceneHint: qSceneHint,
      qCraft: qCraft,
      qCraftHint: qCraftHint,
      qCharTheme: qCharTheme,
      qCharHint: qCharHint
    };
  }

  function paraCard(index, typeId, bodyTotal, yearBand) {
    var n = index + 1;
    var base = "p" + n + "-";
    var beatRow = "";
    if (typeId === "narrative") {
      var bt = bodyTotal || 3;
      var beat = narrativeBeat(index, bt);
      beatRow =
        '<p class="body-beat-hint"><strong>' +
        esc(beat.heading) +
        "</strong> — " +
        esc(beat.tagline) +
        "</p>";
    }
    var toolkit = typeId === "persuasive" ? persuasiveToolkitBlock() : "";
    var bodyId = base + "body";
    var bodyHtml = plainBodyToRichHtml(typeId, "", yearBand);
    return (
      '<div class="para-card" data-para="' +
      n +
      '">' +
      beatRow +
      '<div class="body-editor-wrap">' +
      renderSentenceToolbarHtml(bodyId, typeId) +
      '<label class="visually-hidden" for="' +
      bodyId +
      '">Body paragraph ' +
      n +
      "</label>" +
      '<div contenteditable="true" tabindex="0" spellcheck="true" role="textbox" aria-multiline="true" id="' +
      bodyId +
      '" class="body-unified-textarea body-unified-editor" data-autosave>' +
      bodyHtml +
      "</div>" +
      toolkit +
      "</div></div>"
    );
  }

  function buildPlannerMarkup(typeId) {
    var hookQ, thesisQ, thesisHint;

    if (typeId === "persuasive") {
      hookQ = "What is your opening hook or context for the issue?";
      thesisQ = "What is your contention / stance (main argument)?";
      thesisHint = "One clear sentence readers can agree or disagree with.";
    } else if (typeId === "online") {
      hookQ = "What is your lede / hook (first lines) to pull readers in?";
      thesisQ = "What is your angle / nut graph (why this piece matters now)?";
      thesisHint = "The promise to the reader — what they&rsquo;ll learn or feel.";
    } else if (typeId === "narrative") {
      hookQ = "What is your narrative hook or striking opening?";
      thesisQ = "What is the central theme, message, or question you&rsquo;re exploring?";
      thesisHint = "Even stories benefit from a clear through-line.";
    } else if (typeId === "comparative") {
      hookQ = "What is your intro hook to frame both (or all) texts?";
      thesisQ = "What is your thesis (linked insight across the texts)?";
      thesisHint = "Avoid two mini-essays — show the relationship.";
    } else if (typeId === "informative") {
      hookQ = "What will you use to orient the reader (context, question, or overview)?";
      thesisQ = "What is the controlling idea or purpose of your explanation?";
      thesisHint = "What readers should understand or be able to do by the end — in one sentence.";
    } else if (typeId === "other") {
      hookQ = "What is your intro hook to get the reader interested?";
      thesisQ = "What is your main point / thesis or central focus?";
      thesisHint = "Adapt this to your task — controlling idea for the whole piece.";
    } else {
      hookQ = "What is your intro hook to get the reader interested?";
      thesisQ = "What is your main point / thesis?";
      thesisHint = "Controlling argument or line of thought for the whole piece.";
    }

    var extra = "";
    if (typeId === "persuasive") {
      extra +=
        field(
          "x-audience",
          "Audience & starting position",
          "Who reads this? What do they already agree with, doubt, or care about? (Shapes which appeals and devices will work.)"
        ) +
        field("x-counter", "Counter-argument(s) you will acknowledge", "What would a thoughtful opponent say?") +
        field("x-rebuttal", "Your rebuttal / response", "Why your contention still stands.");
    }
    if (typeId === "online") {
      extra +=
        field("x-headline", "Working headline", "You can list 2–3 options.") +
        field("x-deck", "Deck / subtitle (if using)", "") +
        field("x-cta", "Call to action or closing engagement", "Comment, share, next step, reflection …");
    }
    if (typeId === "narrative") {
      extra +=
        field("n-pov", "Narrator & point of view", "First or third (limited/omniscient); who tells the story, and from how far?") +
        field("n-setting", "Setting & time", "Place, era, and mood — what anchors the reader in a world?") +
        field("n-protag", "Who we follow & what they want", "Protagonist (or focal character): external goal + internal need, if both matter.") +
        field("n-conflict", "Central conflict", "What opposes that want — another person, society, self, nature, time, or silence?") +
        field("n-structure", "Time & structure", "Linear, flashback, in medias res, circular return — how will you move through time on the page?");
    }

    var otherSpecify =
      typeId === "other"
        ? fieldInput(
            "f-other-specify",
            "Describe your text type",
            "What task or format are you planning for? Use language from your task sheet or the Australian Curriculum if it helps.",
            "e.g. multimodal presentation, spoken persuasive, podcast script, editorial …"
          )
        : "";

    var planFieldsOnly =
      otherSpecify +
      field("g-hook", hookQ, "") +
      field("g-thesis", thesisQ, thesisHint) +
      (typeId === "narrative"
        ? ""
        : field(
            "g-points",
            "List your points / arguments",
            "Bullets or one idea per line — sketch what each body paragraph will cover."
          )) +
      extra;

    var n = clamp(bodyCountMemory, MIN_BODY, MAX_BODY);
    bodyCountMemory = n;

    var yearBand = yearBandValue();
    var bodyCardsHtml = "";
    for (var j = 0; j < n; j++) {
      bodyCardsHtml +=
        '<div class="body-card">' +
        '<div class="body-card-head">' +
        '<span class="body-card-title">' +
        '<span class="body-card-title-main">Body ' +
        (j + 1) +
        "</span>" +
        (j === 0
          ? '<span class="body-card-dot-hint">Add your dot-point thoughts below</span>'
          : "") +
        "</span>" +
        '<div class="body-card-actions">' +
        '<span class="card-action-tooltip-host">' +
        "<button type=\"button\" class=\"card-copy\" data-copy=\"" +
        j +
        "\" aria-describedby=\"card-tip-copy-" +
        j +
        "\" aria-label=\"Duplicate this paragraph\">" +
        '<svg class="card-copy-icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        "<rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"/>" +
        "<path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/>" +
        "</svg></button>" +
        '<span id="card-tip-copy-' +
        j +
        '" class="card-action-tooltip" role="tooltip">Duplicate this paragraph</span>' +
        "</span>" +
        '<span class="card-action-tooltip-host">' +
        "<button type=\"button\" class=\"card-remove\" data-remove=\"" +
        j +
        "\" aria-describedby=\"card-tip-remove-" +
        j +
        "\" aria-label=\"Remove this paragraph\">×</button>" +
        '<span id="card-tip-remove-' +
        j +
        '" class="card-action-tooltip" role="tooltip">Remove this paragraph</span>' +
        "</span>" +
        "</div></div>" +
        '<div class="planner-details-inner">' +
        paraCard(j, typeId, n, yearBand) +
        "</div>" +
        "</div>";
    }

    var concQ =
      typeId === "persuasive"
        ? "How will you reinforce your contention and end with impact?"
        : typeId === "online"
          ? "How will you land the piece (synthesis + optional CTA)?"
          : typeId === "narrative"
            ? "How will you resolve or reflect — final image or idea?"
            : typeId === "informative"
              ? "How will you summarise or consolidate what matters most for the reader?"
              : typeId === "other"
                ? "How will you wrap up effectively for this task?"
                : "How will you synthesise your argument and finish strongly?";

    var concHint =
      typeId === "persuasive"
        ? "Circle back to your stance; end memorably; avoid new evidence."
        : typeId === "online"
          ? "Synthesise; optional call to action or reflection for readers."
          : typeId === "narrative"
            ? "Land the emotional or thematic close — image or insight, not a new twist."
            : typeId === "informative"
              ? "Stress what matters most; reader takeaway or next step."
              : typeId === "other"
                ? "Match your task: closure that fits the brief."
                : typeId === "comparative"
                  ? "Unify the texts in one insight; avoid two disconnected endings."
                  : "Synthesise; strong final emphasis without new arguments.";

    var concFieldsOnly = field("g-conclusion", concQ, concHint);

    return (
      "<div class=\"planner-stack\">" +
      '<div class="plan-conclusion-cards">' +
      '<section class="planner-section-card" aria-label="Plan">' +
      '<div class="planner-section-card-head">' +
      sectionTitleWithHint("Plan", buildPlanSectionBubbleInner(typeId, thesisHint)) +
      "</div>" +
      '<div class="planner-details-inner">' +
      '<div class="plan-fields">' +
      planFieldsOnly +
      "</div>" +
      "</div>" +
      "</section>" +
      '<section class="planner-section-card" aria-label="Conclusion">' +
      '<div class="planner-section-card-head">' +
      sectionTitleWithHint("Conclusion", buildConcSectionBubbleInner(typeId)) +
      "</div>" +
      '<div class="planner-details-inner">' +
      '<div class="conc-fields">' +
      concFieldsOnly +
      "</div>" +
      "</div>" +
      "</section>" +
      "</div>" +
      "<section class=\"body-cards-region\" aria-label=\"Body paragraphs\">" +
      '<div class="body-cards-toolbar">' +
      '<div class="body-cards-toolbar-title">' +
      '<h2 class="body-cards-heading">Body paragraphs</h2>' +
      "</div>" +
      '<button type="button" class="primary" id="btn-add-paragraph-end" title="Add a body paragraph at the end">+ Paragraph</button>' +
      "</div>" +
      '<div class="body-cards-grid">' +
      bodyCardsHtml +
      "</div>" +
      "</section>" +
      "</div>"
    );
  }

  function hydrateBodySlotCountFromStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data.bodySlotCount != null) {
        bodyCountMemory = clamp(parseInt(data.bodySlotCount, 10) || 3, MIN_BODY, MAX_BODY);
      } else if (data.fields && data.fields["f-body-count"]) {
        bodyCountMemory = clamp(parseInt(data.fields["f-body-count"], 10) || 3, MIN_BODY, MAX_BODY);
      }
    } catch (e) {
      /* ignore */
    }
  }

  function renderMain() {
    /* After + Paragraph / remove, bodyCountMemory is updated before render — do not
       reload slot count from storage here or we redraw the old number (hydrate runs before saveAll). */
    if (!pendingBodyRestore) {
      hydrateBodySlotCountFromStorage();
    }
    var typeId = $("f-type").value;
    $("planner-main").innerHTML = buildPlannerMarkup(typeId);
    $("type-hint").textContent = getTypeMeta(typeId).hint;
    loadFields();
    if (pendingBodyRestore) {
      /* Pending array is authoritative (add/remove). Do not let loadFields() infer a higher
         count from stale pN-body keys still in JSON before saveAll() prunes them — that broke delete. */
      applyBodyData(pendingBodyRestore);
      bodyCountMemory = clamp(pendingBodyRestore.length, MIN_BODY, MAX_BODY);
      pendingBodyRestore = null;
    }
    bindAutosave();
    bindAddParagraphButton();
    bindSentenceToolbar();
  }

  var saveTimer;
  var saveStatusHideTimer;
  /**
   * tone: "ok" green (browser save), "warn" amber (limits/errors), "muted" grey (info).
   * Omit tone for simple detection from message text.
   */
  function setSaveStatus(msg, tone) {
    var el = $("save-status");
    if (!el) return;
    clearTimeout(saveStatusHideTimer);
    saveStatusHideTimer = null;
    el.textContent = msg || "";
    el.classList.remove("save-status--ok", "save-status--warn", "save-status--muted");
    if (!msg) return;
    var t = tone;
    if (!t) {
      if (/^Saving/i.test(msg) || /^Saved/i.test(msg) || msg === "Cleared") t = "ok";
      else if (/Could not|Maximum \d+|Keep at least/i.test(msg)) t = "warn";
      else t = "muted";
    }
    el.classList.add("save-status--" + t);
  }
  function scheduleHideSaveStatus(ms) {
    clearTimeout(saveStatusHideTimer);
    saveStatusHideTimer = setTimeout(function () {
      setSaveStatus("");
    }, ms || 2000);
  }

  function onBodyEditorPaste(e) {
    var host = e.target.closest && e.target.closest(".body-unified-editor");
    if (host && host.classList.contains("body-structured-host")) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (!text) return;
    try {
      document.execCommand("insertText", false, text);
    } catch (err) {
      /* ignore */
    }
  }

  var DOT_POINT_PREFIX = "• ";

  /** Ensures a leading bullet when there is real text; clears when empty (structured slim fields only). */
  function syncDotPointInSlimField(ta) {
    if (!ta || !ta.classList.contains("body-plan-slim-input")) return;
    var v = ta.value;
    if (!v.trim()) {
      ta.value = "";
      return;
    }
    if (/^[\s•\u2022]+$/.test(v)) {
      ta.value = "";
      return;
    }
    if (/^\s*[•\u2022]\s?/.test(v)) return;
    var start = ta.selectionStart;
    var end = ta.selectionEnd;
    var lead = v.match(/^\s*/);
    var ws = lead ? lead[0] : "";
    var rest = v.slice(ws.length);
    ta.value = ws + DOT_POINT_PREFIX + rest;
    var delta = DOT_POINT_PREFIX.length;
    ta.selectionStart = Math.min((start || 0) + delta, ta.value.length);
    ta.selectionEnd = Math.min((end || 0) + delta, ta.value.length);
  }

  function onStructuredBodyInput(e) {
    if (!e.target.classList.contains("body-plan-slim-input")) return;
    syncDotPointInSlimField(e.target);
    onAnyInput();
  }

  function bindAutosave() {
    var sel = "[data-autosave], #f-name, #f-subject, #f-topic, #f-words, #f-type, #f-year-band";
    document.querySelectorAll(sel).forEach(function (el) {
      el.removeEventListener("input", onAnyInput);
      el.removeEventListener("change", onAnyInput);
    });
    document.querySelectorAll(sel).forEach(function (el) {
      el.addEventListener("input", onAnyInput);
      el.addEventListener("change", onAnyInput);
    });
    document.querySelectorAll(".body-unified-editor").forEach(function (el) {
      el.removeEventListener("paste", onBodyEditorPaste);
      el.addEventListener("paste", onBodyEditorPaste);
      el.removeEventListener("input", onStructuredBodyInput);
      el.addEventListener("input", onStructuredBodyInput);
    });
  }

  function onAnyInput() {
    setSaveStatus("Saving…", "ok");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveAll, 350);
  }

  function collectState() {
    var data = {
      name: $("f-name").value,
      subject: $("f-subject").value,
      topic: $("f-topic").value,
      words: $("f-words").value,
      type: $("f-type").value,
      yearBand: $("f-year-band").value,
      bodySlotCount: clamp(
        Math.max(bodyCountMemory, inferMaxBodyIndexFromDom()),
        MIN_BODY,
        MAX_BODY
      ),
      fields: {}
    };
    document.querySelectorAll("[data-autosave]").forEach(function (el) {
      if (el.id) data.fields[el.id] = readAutosaveValue(el);
    });
    return data;
  }

  function saveAll() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
      setSaveStatus("Saved in this browser", "ok");
      scheduleHideSaveStatus(2200);
    } catch (err) {
      setSaveStatus("Could not save", "warn");
      scheduleHideSaveStatus(4000);
    }
  }

  function loadFields() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data.name != null) $("f-name").value = data.name;
      if (data.subject != null) $("f-subject").value = data.subject;
      if (data.topic != null) $("f-topic").value = data.topic;
      if (data.words != null) $("f-words").value = data.words;
      if (data.yearBand != null && $("f-year-band")) $("f-year-band").value = data.yearBand;
      var fields = data.fields || {};
      if (data.bodySlotCount != null) {
        bodyCountMemory = clamp(parseInt(data.bodySlotCount, 10) || 3, MIN_BODY, MAX_BODY);
      } else if (fields["f-body-count"]) {
        bodyCountMemory = clamp(parseInt(fields["f-body-count"], 10) || 3, MIN_BODY, MAX_BODY);
      }
      var inferredBodies = inferMaxBodyIndexFromFields(fields);
      if (inferredBodies > 0) {
        bodyCountMemory = clamp(Math.max(bodyCountMemory, inferredBodies), MIN_BODY, MAX_BODY);
      }
      var typeForMigrate = data.type != null ? data.type : $("f-type").value;
      var mSlots = clamp(bodyCountMemory, MIN_BODY, MAX_BODY);
      var ybMigrate = $("f-year-band") ? $("f-year-band").value : "910";
      for (var mi = 1; mi <= mSlots; mi++) {
        mergeLegacyParagraphPlan(typeForMigrate, fields, mi, ybMigrate);
      }
      var strippedSentenceOutline = false;
      Object.keys(fields).forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        if (isBodyUnifiedEditor(el)) {
          var rawBody = fields[id];
          if (isOnlyNumberedSentencePlanBody(rawBody, typeForMigrate, ybMigrate)) {
            fields[id] = "";
            strippedSentenceOutline = true;
          }
          writeAutosaveBodyHtml(el, typeForMigrate, fields[id], ybMigrate);
        } else {
          el.value = fields[id];
        }
      });
      if (strippedSentenceOutline) {
        setTimeout(function () {
          saveAll();
        }, 0);
      }
    } catch (e) { /* ignore */ }
  }

  function initTypeSelect() {
    var sel = $("f-type");
    sel.innerHTML = TEXT_TYPES.map(function (t) {
      return "<option value=\"" + t.id + "\">" + esc(t.label) + "</option>";
    }).join("");
  }

  function getOutlineRows() {
    var rows = [];
    rows.push({ label: "Name", value: $("f-name").value });
    rows.push({ label: "Subject / class", value: $("f-subject").value });
    rows.push({ label: "Topic / question", value: $("f-topic").value });
    rows.push({ label: "Word count", value: $("f-words").value });
    var typeLabel = $("f-type").selectedOptions[0] && $("f-type").selectedOptions[0].textContent;
    rows.push({ label: "Text type", value: typeLabel || "" });
    var yb = $("f-year-band");
    if (yb) {
      rows.push({
        label: "Year band",
        value: yb.options[yb.selectedIndex] ? yb.options[yb.selectedIndex].textContent : ""
      });
    }
    var main = $("planner-main");
    if (main) {
      main.querySelectorAll("[data-autosave]").forEach(function (el) {
        var lbl = document.querySelector('label[for="' + el.id + '"]');
        var title;
        var bm = el.id.match(/^p(\d+)-body$/);
        if (bm) {
          title = "Body paragraph " + bm[1];
        } else {
          title = lbl ? lbl.textContent.replace(/\s+/g, " ").trim() : el.id;
        }
        rows.push({ label: title, value: readAutosaveValue(el) });
      });
    }
    return rows;
  }

  function getBudgetPlainBlock() {
    var words = parseInt($("f-words").value, 10);
    var typeId = $("f-type").value;
    var bodyN = clamp(bodyCountMemory || 3, MIN_BODY, MAX_BODY);
    var b = computeBudget(words, typeId, bodyN);
    if (!b) return "";
    return (
      "Word budget (guide)\n" +
      "— Introduction: ≈ " + formatRange(b.intro) + " words\n" +
      "— Each body paragraph (" + b.bodyN + "×): ≈ " + formatRange(b.bodyEach) + " words\n" +
      "— Conclusion: ≈ " + formatRange(b.conclusion) + " words"
    );
  }

  function outlineText() {
    var lines = [];
    getOutlineRows().forEach(function (row) {
      lines.push(row.label + ":");
      lines.push(row.value || "—");
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  function escHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildMrCEmailPlain() {
    var name = ($("f-name").value || "").trim() || "Student";
    var budget = getBudgetPlainBlock();
    var lines = [];
    lines.push("Dear Mr C,");
    lines.push("");
    lines.push("Please find my essay plan below.");
    lines.push("");
    lines.push("────────────────────────────────────────");
    lines.push("DETAILS");
    lines.push("────────────────────────────────────────");
    getOutlineRows().forEach(function (row) {
      lines.push("");
      lines.push(row.label.toUpperCase());
      lines.push(row.value ? row.value : "—");
    });
    if (budget) {
      lines.push("");
      lines.push("────────────────────────────────────────");
      lines.push(budget);
    }
    lines.push("");
    lines.push("────────────────────────────────────────");
    lines.push("");
    lines.push("Kind regards,");
    lines.push(name);
    return lines.join("\n").trim();
  }

  function buildMrCEmailHtml() {
    var name = escHtml(($("f-name").value || "").trim() || "Student");
    var budget = getBudgetPlainBlock();
    var wrap =
      "font-family: Georgia, Cambria, 'Times New Roman', Times, serif; font-size: 14pt; line-height: 1.5; color: #222222;";
    var h =
      "font-size: 14pt; font-weight: 700; margin: 20pt 0 8pt 0; color: #111111; letter-spacing: 0.02em; border-bottom: 1px solid #cccccc; padding-bottom: 4pt;";
    var meta = "font-size: 14pt; margin: 0 0 14pt 0;";
    var lbl = "font-size: 11pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #444444; margin: 16pt 0 4pt 0;";
    var block = "font-size: 14pt; margin: 0 0 14pt 0; white-space: pre-wrap;";
    var parts = [];
    parts.push('<div style="' + wrap + '">');
    parts.push('<p style="' + meta + '">Dear Mr C,</p>');
    parts.push('<p style="' + meta + '">Please find my essay plan below.</p>');
    parts.push('<p style="' + h + '">Details</p>');
    getOutlineRows().forEach(function (row) {
      parts.push('<p style="' + lbl + '">' + escHtml(row.label) + "</p>");
      parts.push('<p style="' + block + '">' + escHtml(row.value || "—") + "</p>");
    });
    if (budget) {
      parts.push('<p style="' + h + '">Word budget (guide)</p>');
      parts.push('<p style="' + block + '">' + escHtml(budget) + "</p>");
    }
    parts.push('<p style="' + meta + ' margin-top:22pt;">Kind regards,<br/>' + name + "</p>");
    parts.push("</div>");
    return parts.join("");
  }

  function mailtoShortBody() {
    var name = ($("f-name").value || "").trim() || "Student";
    return (
      "Dear Mr C,\n\n" +
      "My full essay plan has been copied to my clipboard.\n\n" +
      "Please click in the message body and paste (⌘V on Mac, Ctrl+V on Windows) so the formatting appears at 14pt.\n\n" +
      "Kind regards,\n" +
      name
    );
  }

  function copyEmailToClipboard(html, plain) {
    if (navigator.clipboard && typeof ClipboardItem !== "undefined") {
      try {
        var htmlBlob = new Blob([html], { type: "text/html" });
        var textBlob = new Blob([plain], { type: "text/plain" });
        return navigator.clipboard.write([
          new ClipboardItem({
            "text/html": htmlBlob,
            "text/plain": textBlob
          })
        ]);
      } catch (e) {
        /* fall through */
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(plain);
    }
    return Promise.reject(new Error("Clipboard not available"));
  }

  function openMailtoMrC() {
    var subjParts = ["Essay plan"];
    var n = ($("f-name").value || "").trim();
    var t = ($("f-topic").value || "").trim();
    if (n) subjParts.push(n);
    if (t) subjParts.push(t.length > 40 ? t.slice(0, 37) + "…" : t);
    var subj = subjParts.join(" — ");
    var fullPlain = buildMrCEmailPlain();
    var fullHtml = buildMrCEmailHtml();
    var maxLen = 6800;
    var bodyForMail = fullPlain;
    var base = "mailto:" + MR_C_EMAIL + "?subject=" + encodeURIComponent(subj) + "&body=";
    if ((base + encodeURIComponent(bodyForMail)).length > maxLen) {
      bodyForMail = mailtoShortBody();
    }
    copyEmailToClipboard(fullHtml, fullPlain)
      .then(function () {
        setSaveStatus("Opening email — Select All in the body, then Paste (⌘V / Ctrl+V) for 14pt", "muted");
        scheduleHideSaveStatus(5000);
        window.location.href = base + encodeURIComponent(bodyForMail);
      })
      .catch(function () {
        window.location.href = base + encodeURIComponent(bodyForMail);
        setSaveStatus("Could not copy formatted text — email still opened", "warn");
        scheduleHideSaveStatus(4000);
      });
  }

  $("btn-copy").addEventListener("click", function () {
    var text = outlineText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setSaveStatus("Outline copied", "muted");
        scheduleHideSaveStatus(2000);
      });
    } else {
      prompt("Copy this outline:", text);
    }
  });

  $("btn-email-mrc").addEventListener("click", function () {
    openMailtoMrC();
  });

  $("btn-clear").addEventListener("click", function () {
    if (!confirm("Clear saved data in this browser for this planner?")) return;
    localStorage.removeItem(STORAGE_KEY);
    bodyCountMemory = 3;
    $("f-name").value = "";
    $("f-subject").value = "";
    $("f-topic").value = "";
    $("f-words").value = "";
    $("f-type").selectedIndex = 0;
    if ($("f-year-band")) $("f-year-band").value = "910";
    renderMain();
    setSaveStatus("Cleared", "ok");
    scheduleHideSaveStatus(2000);
  });

  $("f-type").addEventListener("change", function () {
    saveAll();
    renderMain();
  });

  $("f-year-band").addEventListener("change", function () {
    saveAll();
    renderMain();
  });

  initTypeSelect();

  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      if (data.type) $("f-type").value = data.type;
      if (data.yearBand != null && $("f-year-band")) $("f-year-band").value = data.yearBand;
      if (data.bodySlotCount != null) {
        bodyCountMemory = clamp(parseInt(data.bodySlotCount, 10) || 3, MIN_BODY, MAX_BODY);
      } else {
        var fbc = (data.fields || {})["f-body-count"];
        if (fbc != null) bodyCountMemory = clamp(parseInt(fbc, 10) || 3, MIN_BODY, MAX_BODY);
      }
    }
  } catch (e) { /* ignore */ }

  renderMain();
})();
  </script>
</body>
</html>
